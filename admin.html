<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — West Bengal PDF System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-[#070b12] text-slate-100 min-h-screen p-4 sm:p-6">

  <!-- 1. LOGIN SCREEN -->
  <div id="authScreen" class="max-w-md mx-auto mt-14 glass border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="h-12 w-12 rounded-2xl bg-indigo-600 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-lock text-xl text-white"></i>
      </div>
      <h2 class="text-xl font-bold text-white">Administrator Access</h2>
      <p class="text-xs text-slate-400 mt-1">West Bengal PDF Formats Management Engine</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-300">Enter User ID</label>
        <input 
          id="inUserId" 
          type="email" 
          placeholder="Enter User ID" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 mt-1"
        />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300">Enter Password</label>
        <input 
          id="inPassword" 
          type="password" 
          placeholder="Enter Password" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 mt-1"
        />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300">GitHub Access Token (starts with ghp_)</label>
        <input 
          id="inToken" 
          type="password" 
          placeholder="Enter GitHub Token for sync" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 mt-1"
        />
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-xs shadow-lg shadow-indigo-600/30">
        Secure Login
      </button>
      <p id="loginError" class="text-xs text-red-400 text-center font-medium hidden"></p>
    </form>
    
    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-arrow-left text-[10px]"></i> View Public Website
      </a>
    </div>
  </div>

  <!-- 2. DASHBOARD VIEW -->
  <div id="dashScreen" class="max-w-4xl mx-auto hidden space-y-6">
    <header class="glass border border-slate-800 p-4 sm:p-5 rounded-2xl flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="h-3 w-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 class="text-sm sm:text-base font-bold text-white">Administrative Portal Controller</h1>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" target="_blank" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-xl font-medium transition text-slate-300">
          Open Portal
        </a>
        <button onclick="logoutAdmin()" class="px-3 py-1.5 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white border border-red-500/30 text-xs rounded-xl font-medium transition">
          Sign Out
        </button>
      </div>
    </header>

    <!-- SECTION A: TOP NOTICE TICKER -->
    <div class="glass border border-slate-800 p-5 rounded-2xl">
      <h2 class="text-xs font-bold text-white uppercase tracking-wider mb-2 flex items-center gap-2">
        <i class="fa-solid fa-bullhorn text-indigo-400"></i> Update Header Notice Ticker
      </h2>
      <div class="flex gap-2">
        <input 
          id="tickerInput" 
          type="text" 
          placeholder="Type breaking headline for top of website..." 
          class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500"
        />
        <button onclick="saveTicker()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl font-bold text-xs transition">
          Save Headline
        </button>
      </div>
    </div>

    <!-- SECTION B: UPLOAD OFFICIAL PDF NOTICE -->
    <div class="glass border border-slate-800 p-5 rounded-2xl">
      <h2 class="text-xs font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
        <i class="fa-solid fa-file-circle-plus text-amber-400"></i> Publish Departmental Notice (PDF)
      </h2>
      <form onsubmit="submitNotice(event)" class="space-y-3">
        <input 
          id="noticeTitle" 
          type="text" 
          placeholder="Notice Subject / Headline (e.g. Schedule for Digitization 2026)" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-indigo-500"
        />
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Select Notice PDF File</label>
          <input 
            id="noticeFile" 
            type="file" 
            accept="application/pdf" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-400"
          />
        </div>
        <button type="submit" id="btnNotice" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition">
          Publish Notice
        </button>
      </form>

      <!-- Manage Notices -->
      <div class="mt-5 pt-4 border-t border-slate-800">
        <h3 class="text-[11px] font-bold text-slate-400 uppercase mb-2">Active Notices (Delete Option)</h3>
        <div id="adminNoticesList" class="space-y-2"></div>
      </div>
    </div>

    <!-- SECTION C: UPLOAD IMPORTANT PDF FORMAT -->
    <div class="glass border border-slate-800 p-5 rounded-2xl">
      <h2 class="text-xs font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i> Upload Important PDF Format
      </h2>
      <form onsubmit="submitDocument(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input 
          id="docTitle" 
          type="text" 
          placeholder="Format Title (e.g. Gram Panchayat Verification Application)" 
          required 
          class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-indigo-500 sm:col-span-2"
        />
        <select 
          id="docCategory" 
          required 
          class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-indigo-500"
        >
          <option value="Panchayat & Rural">Panchayat & Rural</option>
          <option value="Commercial & Revenue">Commercial & Revenue</option>
          <option value="Certificates & Verification">Certificates & Verification</option>
          <option value="General Administration">General Administration</option>
        </select>
        
        <div>
          <input 
            id="docFile" 
            type="file" 
            accept="application/pdf" 
            required 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-400"
          />
        </div>

        <textarea 
          id="docDesc" 
          rows="3" 
          placeholder="Document description, requirements, or guidelines for citizens..." 
          class="sm:col-span-2 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none focus:border-indigo-500"
        ></textarea>

        <button type="submit" id="btnDoc" class="sm:col-span-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition text-xs shadow-md">
          Save & Publish PDF Format
        </button>
      </form>
    </div>

    <!-- SECTION D: MANAGE & REMOVE PDF FORMATS -->
    <div class="glass border border-slate-800 p-5 rounded-2xl">
      <h2 class="text-xs font-bold text-white uppercase tracking-wider mb-3 flex items-center justify-between">
        <span>Uploaded PDF Formats Catalog</span>
        <span id="docCount" class="text-slate-400 font-normal">0 Total</span>
      </h2>
      <div id="adminDocsList" class="space-y-2"></div>
    </div>
  </div>

  <script>
    const REQUIRED_ID = "jahirnarjinary04@gmail.com";
    const REQUIRED_PW = "Jahir@7047";

    const GH_USER = "jahirkumarnarjinary";
    const GH_REPO = "West-Bengal-All-PDF-Formats-Notices";
    const FILE_PATH = "portal-data.json";

    let state = { ticker: "", notices: [], documents: [] };

    function checkAuthSession() {
      if (sessionStorage.getItem("ADMIN_AUTHORIZED") === "YES") {
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("dashScreen").classList.remove("hidden");
        fetchFromRepo();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const uid = document.getElementById("inUserId").value.trim();
      const pwd = document.getElementById("inPassword").value;
      const tok = document.getElementById("inToken").value.trim();
      const err = document.getElementById("loginError");

      if (uid === REQUIRED_ID && pwd === REQUIRED_PW && tok.startsWith("ghp_")) {
        sessionStorage.setItem("ADMIN_AUTHORIZED", "YES");
        localStorage.setItem("GH_SYNC_TOKEN", tok);
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("dashScreen").classList.remove("hidden");
        fetchFromRepo();
      } else {
        err.textContent = "Invalid User ID or Password. Make sure your GitHub Token starts with ghp_";
        err.classList.remove("hidden");
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem("ADMIN_AUTHORIZED");
      location.reload();
    }

    function utoa(str) {
      return window.btoa(unescape(encodeURIComponent(str)));
    }

    function atou(str) {
      return decodeURIComponent(escape(window.atob(str)));
    }

    async function fetchFromRepo() {
      const token = localStorage.getItem("GH_SYNC_TOKEN");
      const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${FILE_PATH}?ref=main&t=${Date.now()}`;

      try {
        const res = await fetch(url, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });
        if (res.ok) {
          const json = await res.json();
          const clean = json.content.replace(/\s/g, '');
          state = JSON.parse(atou(clean));
          renderDashboard();
        }
      } catch (err) {
        console.error("Repository read error:", err);
      }
    }

    async function commitData(commitMsg) {
      const token = localStorage.getItem("GH_SYNC_TOKEN");
      const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${FILE_PATH}`;

      let freshSha = null;
      try {
        const getRes = await fetch(`${url}?ref=main&t=${Date.now()}`, {
          headers: { 
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });
        if (getRes.ok) {
          const getData = await getRes.json();
          freshSha = getData.sha;
        }
      } catch (e) {
        console.error("Could not obtain SHA:", e);
      }

      const contentString = JSON.stringify(state, null, 2);
      const contentBase64 = utoa(contentString);

      const body = {
        message: commitMsg,
        content: contentBase64,
        branch: "main"
      };
      if (freshSha) body.sha = freshSha;

      const res = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
          "Accept": "application/vnd.github.v3+json"
        },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        renderDashboard();
        return true;
      } else {
        const errJson = await res.json();
        alert(`GitHub API Error: ${errJson.message || "Commit failed"}`);
        return false;
      }
    }

    function renderDashboard() {
      document.getElementById("tickerInput").value = state.ticker || "";

      // Notices
      const nList = document.getElementById("adminNoticesList");
      nList.innerHTML = "";
      const notices = state.notices || [];

      if (notices.length === 0) {
        nList.innerHTML = `<p class="text-xs text-slate-500">No active notices.</p>`;
      } else {
        notices.forEach((n, idx) => {
          const row = document.createElement("div");
          row.className = "flex items-center justify-between p-2.5 bg-slate-950 rounded-xl border border-slate-800 text-xs";
          row.innerHTML = `
            <div>
              <p class="font-bold text-white">${escapeSafe(n.title)}</p>
              <p class="text-[10px] text-slate-400">${n.date} • ${escapeSafe(n.fileName || 'No attachment')}</p>
            </div>
            <button onclick="removeNotice(${idx})" class="text-red-400 hover:text-red-300 px-2.5 py-1 bg-red-950/40 border border-red-800/80 rounded-lg">
              <i class="fa-solid fa-trash-can"></i> Delete
            </button>
          `;
          nList.appendChild(row);
        });
      }

      // Documents
      const dList = document.getElementById("adminDocsList");
      dList.innerHTML = "";
      const docs = state.documents || [];
      document.getElementById("docCount").textContent = `${docs.length} Total`;

      if (docs.length === 0) {
        dList.innerHTML = `<p class="text-xs text-slate-500">No PDF formats uploaded.</p>`;
      } else {
        docs.forEach((d, idx) => {
          const row = document.createElement("div");
          row.className = "flex items-center justify-between p-2.5 bg-slate-950 rounded-xl border border-slate-800 text-xs";
          row.innerHTML = `
            <div>
              <p class="font-bold text-white">${escapeSafe(d.title)}</p>
              <p class="text-[10px] text-slate-400">${escapeSafe(d.category)} • ${escapeSafe(d.fileName)}</p>
            </div>
            <button onclick="removeDocument(${idx})" class="text-red-400 hover:text-red-300 px-2.5 py-1 bg-red-950/40 border border-red-800/80 rounded-lg">
              <i class="fa-solid fa-trash-can"></i> Delete
            </button>
          `;
          dList.appendChild(row);
        });
      }
    }

    async function saveTicker() {
      state.ticker = document.getElementById("tickerInput").value.trim();
      const ok = await commitData("Updated portal ticker headline");
      if (ok) alert("Header Notice Ticker updated on live website!");
    }

    async function submitNotice(e) {
      e.preventDefault();
      const btn = document.getElementById("btnNotice");
      const title = document.getElementById("noticeTitle").value.trim();
      const file = document.getElementById("noticeFile").files[0];

      btn.disabled = true;
      btn.innerText = "Publishing Notice...";

      const proceed = async (fileUrl, fileName) => {
        if (!state.notices) state.notices = [];
        state.notices.unshift({
          id: "not_" + Date.now(),
          title,
          date: new Date().toISOString().slice(0, 10),
          fileUrl,
          fileName
        });

        const ok = await commitData(`Published notice: ${title}`);
        btn.disabled = false;
        btn.innerText = "Publish Notice";
        if (ok) {
          e.target.reset();
          alert("Notice successfully published on live website!");
        }
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => proceed(evt.target.result, file.name);
        reader.readAsDataURL(file);
      } else {
        proceed("", "");
      }
    }

    async function removeNotice(idx) {
      if (confirm("Delete this notice permanently?")) {
        state.notices.splice(idx, 1);
        const ok = await commitData("Deleted notice from portal");
        if (ok) alert("Notice deleted from live portal.");
      }
    }

    async function submitDocument(e) {
      e.preventDefault();
      const btn = document.getElementById("btnDoc");
      const file = document.getElementById("docFile").files[0];
      const title = document.getElementById("docTitle").value.trim();
      const category = document.getElementById("docCategory").value;
      const description = document.getElementById("docDesc").value.trim();

      if (!file) return;

      btn.disabled = true;
      btn.innerText = "Encoding & Publishing PDF...";

      const reader = new FileReader();
      reader.onload = async (evt) => {
        if (!state.documents) state.documents = [];
        state.documents.unshift({
          id: "doc_" + Date.now(),
          title,
          category,
          description,
          fileName: file.name,
          fileUrl: evt.target.result,
          uploadDate: new Date().toISOString().slice(0, 10)
        });

        const ok = await commitData(`Added PDF Format: ${title}`);
        btn.disabled = false;
        btn.innerText = "Save & Publish PDF Format";
        if (ok) {
          e.target.reset();
          alert("Important PDF Format successfully uploaded! Available for all citizens to download.");
        }
      };
      reader.readAsDataURL(file);
    }

    async function removeDocument(idx) {
      if (confirm("Delete this PDF Format from public archive?")) {
        state.documents.splice(idx, 1);
        const ok = await commitData("Deleted PDF format from portal");
        if (ok) alert("PDF format deleted successfully.");
      }
    }

    function escapeSafe(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    checkAuthSession();
  </script>
</body>
</html>
